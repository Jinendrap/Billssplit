<!-- Structured data: helps Google understand this is a free web app -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",

  "name": "BillSplit",

  "operatingSystem": "Any (web browser)",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Firebase (free, client-side only, no server needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- GSAP (animation — CDN only, no build step) -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- =====================================================================
     STYLES — split by responsibility instead of one growing stylesheet.
     Load order matters here (later files may rely on tokens/base rules
     defined earlier), but there is no build step: these are just plain
     <link> tags, so the file layout on disk is exactly what ships.
     ===================================================================== -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/landing.css">
</head>
<body>
<div class="ambient">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>
<div class="wrap">
  <div class="app-col">
    <div class="brand">
      <div>
        <h1 onclick="goHome()" style="cursor:pointer;" title="Back to home">Bill<span>Split</span></h1>
        <p>Everyone pays only for what they had.</p>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="toastHost" aria-live="polite"></div>

<!-- =====================================================================
     SCRIPTS — plain, non-module <script> tags loaded in dependency order.
     Every function here is a normal top-level declaration, so it's globally
     callable exactly like before (including from the onclick="..." handlers
     built inside template strings) — splitting the file changes nothing
     about how any of this executes, only how it's organized on disk.
     ===================================================================== -->
<script src="js/firebase-service.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui-feedback.js"></script>
<script src="js/motion.js"></script>
<script src="js/state.js"></script>

<script src="js/pages/items.js"></script>
<script src="js/pages/charges.js"></script>
<script src="js/pages/split.js"></script>
<script src="js/app.js"></script>
</body>
</html>
